<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- ============ HEADER ============ -->
    <header class="header">
      <a class="logo" href="#">
        <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="9" fill="currentColor" />
          <path d="M14 18c0 7 3 10 7 10s6-3 6-8m0 0v12c0 4-3 7-8 7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" />
          <circle cx="33" cy="15" r="3" fill="#fff" />
        </svg>
        <span class="logo-text" data-site-name>Library</span>
      </a>
      <button class="btn btn-primary" data-open-submit>
        <span class="btn-plus" aria-hidden="true">+</span> Submit
      </button>
    </header>

    <!-- ============ MAIN ============ -->
    <div class="layout">
      <aside class="sidebar">
        <h2 class="sidebar-title">Categories</h2>
        <!-- Filled in by app.js from config.js -->
        <nav id="category-nav"></nav>
      </aside>

      <main class="content">
        <h1 class="page-title" id="page-title"></h1>
        <hr class="divider" />
        <!-- Cards are rendered here by app.js -->
        <div class="grid" id="grid"></div>
      </main>
    </div>

    <!-- ============ FOOTER ============ -->
    <footer class="footer">
      <svg class="rings" viewBox="0 0 1200 1200" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
        <!-- All rings share the biggest size; CSS shrinks them and grows them outward -->
        <circle cx="600" cy="600" r="580" />
        <circle cx="600" cy="600" r="580" />
        <circle cx="600" cy="600" r="580" />
        <circle cx="600" cy="600" r="580" />
        <circle cx="600" cy="600" r="580" />
      </svg>
      <div class="footer-cta">
        <h2 class="footer-heading" data-footer="heading"></h2>
        <p class="footer-text" data-footer="text"></p>
        <button class="btn btn-primary" data-open-submit>Submit</button>
      </div>
      <div class="footer-bottom">
        <span data-footer="credit"></span>
        <a data-footer="link" target="_blank" rel="noopener"></a>
      </div>
    </footer>

    <!-- ============ SUBMIT DIALOG ============ -->
    <!-- Sends to api/submit.js, which adds an unpublished row in Notion -->
    <dialog class="dialog" id="form-dialog">
      <form id="submit-form" novalidate>
        <div class="dialog-head">
          <h3>Submit a website</h3>
          <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
        </div>

        <p class="dialog-note">Submissions are reviewed before they appear on the site.</p>

        <label class="field">
          <span>Website URL *</span>
          <input name="url" type="url" placeholder="https://example.com" maxlength="500" required />
        </label>

        <label class="field">
          <span>Title</span>
          <input name="title" type="text" placeholder="Leave empty to use the domain name" maxlength="100" />
        </label>

        <label class="field">
          <span>Description</span>
          <textarea name="description" rows="3" placeholder="What makes it great?" maxlength="300"></textarea>
        </label>

        <label class="field">
          <span>Category</span>
          <select name="type" id="category-select"></select>
        </label>

        <label class="field">
          <span>Thumbnail image link (optional)</span>
          <input name="thumbnail" type="url" placeholder="https://example.com/image.png" maxlength="500" />
        </label>

        <!-- Spam trap: hidden from people, bots tend to fill it in -->
        <label class="trap" aria-hidden="true">
          Company <input name="company" type="text" tabindex="-1" autocomplete="off" />
        </label>

        <p class="form-message" id="form-message" role="status"></p>

        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="send-btn">Submit</button>
        </div>
      </form>

      <!-- Shown after a successful submission -->
      <div class="thanks" id="thanks" hidden>
        <h3>Thanks!</h3>
        <p>Your suggestion was sent. It will appear on the site once it's reviewed.</p>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" id="submit-another">Submit another</button>
          <button type="button" class="btn btn-primary" data-close>Done</button>
        </div>
      </div>
    </dialog>

    <!-- Order matters: config must load before app -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
