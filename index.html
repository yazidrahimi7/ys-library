<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Feather icons (https://feathericons.com). Use: <i data-feather="search"></i> -->
    <script src="https://unpkg.com/feather-icons@4.29.2/dist/feather.min.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- ============ SIDEBAR ============ -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <a class="logo" href="#all" aria-label="Library home">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <rect x="2" y="2" width="44" height="44" rx="10" fill="#fff" />
              <path d="M14 18c0 7 3 10 7 10s6-3 6-8m0 0v12c0 4-3 7-8 7" fill="none" stroke="#0c0c0c" stroke-width="3.4" stroke-linecap="round" />
              <circle cx="33" cy="15" r="3" fill="#0c0c0c" />
            </svg>
          </a>
          <!-- Only visible on tablet/mobile, where the sidebar slides in -->
          <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close menu">
            <i data-feather="x"></i>
          </button>
        </div>

        <!-- Filled in by app.js from config.js -->
        <nav class="nav" id="nav"></nav>

        <!-- Submit card -->
        <div class="promo">
          <div class="promo-art" aria-hidden="true"></div>
          <p class="promo-heading" data-text="promo.heading"></p>
          <p class="promo-text" data-text="promo.text"></p>
          <button class="btn-pill" data-open-submit>
            <i data-feather="plus"></i> <span data-cta-label>Submit</span>
          </button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- ============ MAIN ============ -->
      <main class="main">
        <div class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
            <i data-feather="menu"></i>
          </button>
          <label class="search">
            <i data-feather="search"></i>
            <input id="search" type="search" autocomplete="off" aria-label="Search websites" />
          </label>
          <!-- Only visible on tablet/mobile (the sidebar's Submit card is hidden there) -->
          <button class="icon-btn submit-btn" data-open-submit aria-label="Submit a website">
            <i data-feather="plus"></i>
          </button>
        </div>

        <!-- Sections of cards are rendered here by app.js -->
        <div id="content"></div>
      </main>
    </div>

    <!-- ============ SUBMIT / UPLOAD DIALOG ============ -->
    <!-- Two modes (set by app.js):
         "website" → api/submit.js adds an unpublished row in Notion
         "upload"  → api/upload.js adds an image to the gallery (needs your password)
         Elements with data-only="website" / "upload" only show in that mode. -->
    <dialog class="dialog" id="form-dialog">
      <form id="submit-form" novalidate>
        <div class="dialog-head">
          <h3 id="form-title">Submit a website</h3>
          <button type="button" class="icon-btn" data-close aria-label="Close">
            <i data-feather="x"></i>
          </button>
        </div>

        <p class="dialog-note" data-only="website">Submissions are reviewed before they appear on the site.</p>
        <p class="dialog-note" data-only="upload">Images are shrunk before uploading and appear in the gallery right away.</p>

        <!-- Upload mode: the image -->
        <div class="field" data-only="upload">
          <span>Image *</span>
          <label class="image-pick" id="image-pick">
            <input type="file" id="image-input" accept="image/*" />
            <img id="image-preview" alt="" hidden />
            <span class="image-pick-hint" id="image-hint">
              <i data-feather="image"></i>
              Tap to choose a screenshot
            </span>
          </label>
        </div>

        <label class="field" data-only="website">
          <span>Website URL *</span>
          <input name="url" type="url" placeholder="https://example.com" maxlength="500" />
        </label>

        <label class="field">
          <span>Title</span>
          <input name="title" type="text" id="title-input" maxlength="100" />
        </label>

        <label class="field">
          <span>Description</span>
          <textarea name="description" rows="3" placeholder="What makes it great?" maxlength="300"></textarea>
        </label>

        <label class="field" data-only="website">
          <span>Category</span>
          <select name="type" id="category-select"></select>
        </label>

        <label class="field" data-only="website">
          <span>Thumbnail image link (optional)</span>
          <input name="thumbnail" type="url" placeholder="https://example.com/image.png" maxlength="500" />
          <!-- Shown only when screenshots are running low (filled in by app.js) -->
          <span class="quota-note" id="quota-note" hidden>
            <i data-feather="info"></i>
            <span id="quota-text"></span>
          </span>
        </label>

        <!-- Upload mode: only asked once; the browser remembers it afterwards -->
        <label class="field" data-only="upload" id="password-field">
          <span>Password</span>
          <input type="password" id="password-input" autocomplete="current-password" />
        </label>

        <!-- Spam trap: hidden from people, bots tend to fill it in -->
        <label class="trap" aria-hidden="true">
          Company <input name="company" type="text" tabindex="-1" autocomplete="off" />
        </label>

        <p class="form-message" id="form-message" role="status"></p>

        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="send-btn">Submit</button>
        </div>
      </form>

      <!-- Shown after a successful submission / upload -->
      <div class="thanks" id="thanks" hidden>
        <h3 id="thanks-title">Thanks!</h3>
        <p id="thanks-text"></p>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" id="submit-another">Add another</button>
          <button type="button" class="btn btn-primary" data-close>Done</button>
        </div>
      </div>
    </dialog>

    <!-- ============ IMAGE VIEWER (gallery) ============ -->
    <dialog class="lightbox" id="lightbox" aria-label="Image viewer">
      <button class="icon-btn lightbox-close" data-close aria-label="Close"><i data-feather="x"></i></button>
      <button class="icon-btn lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image"><i data-feather="chevron-left"></i></button>
      <figure class="lightbox-figure">
        <img id="lightbox-img" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button class="icon-btn lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image"><i data-feather="chevron-right"></i></button>
    </dialog>

    <!-- Order matters: config must load before app -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
