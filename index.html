<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Feather icons (https://feathericons.com). Use: <i data-feather="search"></i> -->
    <script src="https://unpkg.com/feather-icons@4.29.2/dist/feather.min.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- ============ SIDEBAR ============ -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <a class="logo" href="#all" aria-label="Library home">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <rect x="2" y="2" width="44" height="44" rx="10" fill="#fff" />
              <path d="M14 18c0 7 3 10 7 10s6-3 6-8m0 0v12c0 4-3 7-8 7" fill="none" stroke="#0c0c0c" stroke-width="3.4" stroke-linecap="round" />
              <circle cx="33" cy="15" r="3" fill="#0c0c0c" />
            </svg>
          </a>
          <!-- Only visible on tablet/mobile, where the sidebar slides in -->
          <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close menu">
            <i data-feather="x"></i>
          </button>
        </div>

        <!-- Filled in by app.js from config.js -->
        <nav class="nav" id="nav"></nav>

        <!-- Submit card -->
        <div class="promo">
          <div class="promo-art" aria-hidden="true"></div>
          <p class="promo-heading" data-text="promo.heading"></p>
          <p class="promo-text" data-text="promo.text"></p>
          <button class="btn-pill" data-open-submit>
            <i data-feather="plus"></i> Submit
          </button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- ============ MAIN ============ -->
      <main class="main">
        <div class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
            <i data-feather="menu"></i>
          </button>
          <label class="search">
            <i data-feather="search"></i>
            <input id="search" type="search" autocomplete="off" aria-label="Search websites" />
          </label>
        </div>

        <!-- Sections of cards are rendered here by app.js -->
        <div id="content"></div>
      </main>
    </div>

    <!-- ============ SUBMIT DIALOG ============ -->
    <!-- Sends to api/submit.js, which adds an unpublished row in Notion -->
    <dialog class="dialog" id="form-dialog">
      <form id="submit-form" novalidate>
        <div class="dialog-head">
          <h3>Submit a website</h3>
          <button type="button" class="icon-btn" data-close aria-label="Close">
            <i data-feather="x"></i>
          </button>
        </div>

        <p class="dialog-note">Submissions are reviewed before they appear on the site.</p>

        <label class="field">
          <span>Website URL *</span>
          <input name="url" type="url" placeholder="https://example.com" maxlength="500" required />
        </label>

        <label class="field">
          <span>Title</span>
          <input name="title" type="text" placeholder="Leave empty to use the domain name" maxlength="100" />
        </label>

        <label class="field">
          <span>Description</span>
          <textarea name="description" rows="3" placeholder="What makes it great?" maxlength="300"></textarea>
        </label>

        <label class="field">
          <span>Category</span>
          <select name="type" id="category-select"></select>
        </label>

        <label class="field">
          <span>Thumbnail image link (optional)</span>
          <input name="thumbnail" type="url" placeholder="https://example.com/image.png" maxlength="500" />
        </label>

        <!-- Spam trap: hidden from people, bots tend to fill it in -->
        <label class="trap" aria-hidden="true">
          Company <input name="company" type="text" tabindex="-1" autocomplete="off" />
        </label>

        <p class="form-message" id="form-message" role="status"></p>

        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="send-btn">Submit</button>
        </div>
      </form>

      <!-- Shown after a successful submission -->
      <div class="thanks" id="thanks" hidden>
        <h3>Thanks!</h3>
        <p>Your suggestion was sent. It will appear on the site once it's reviewed.</p>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" id="submit-another">Submit another</button>
          <button type="button" class="btn btn-primary" data-close>Done</button>
        </div>
      </div>
    </dialog>

    <!-- Order matters: config must load before app -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
