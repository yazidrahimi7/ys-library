<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- ============ HEADER ============ -->
    <header class="header">
      <a class="logo" href="#">
        <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="9" fill="currentColor" />
          <path d="M14 18c0 7 3 10 7 10s6-3 6-8m0 0v12c0 4-3 7-8 7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" />
          <circle cx="33" cy="15" r="3" fill="#fff" />
        </svg>
        <span class="logo-text" data-site-name>Library</span>
      </a>
      <button class="btn btn-primary" data-open-submit>
        <span class="btn-plus" aria-hidden="true">+</span> Submit
      </button>
    </header>

    <!-- ============ MAIN ============ -->
    <div class="layout">
      <aside class="sidebar">
        <h2 class="sidebar-title">Categories</h2>
        <!-- Filled in by app.js from config.js -->
        <nav id="category-nav"></nav>

        <div class="backup">
          <span>Backup</span>
          <button class="link-btn" id="export-btn">Export</button>
          <button class="link-btn" id="import-btn">Import</button>
          <input type="file" id="import-file" accept="application/json" hidden />
        </div>
      </aside>

      <main class="content">
        <h1 class="page-title" id="page-title"></h1>
        <hr class="divider" />
        <!-- Cards are rendered here by app.js -->
        <div class="grid" id="grid"></div>
      </main>
    </div>

    <!-- ============ FOOTER ============ -->
    <footer class="footer">
      <svg class="rings" viewBox="0 0 1200 1200" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
        <!-- All rings share the biggest size; CSS shrinks them and grows them outward -->
        <circle cx="600" cy="600" r="580" />
        <circle cx="600" cy="600" r="580" />
        <circle cx="600" cy="600" r="580" />
        <circle cx="600" cy="600" r="580" />
        <circle cx="600" cy="600" r="580" />
      </svg>
      <div class="footer-cta">
        <h2 class="footer-heading" data-footer="heading"></h2>
        <p class="footer-text" data-footer="text"></p>
        <button class="btn btn-primary" data-open-submit>Submit</button>
      </div>
      <div class="footer-bottom">
        <span data-footer="credit"></span>
        <a data-footer="link" target="_blank" rel="noopener"></a>
      </div>
    </footer>

    <!-- ============ SUBMIT / EDIT DIALOG ============ -->
    <dialog class="dialog" id="form-dialog">
      <form id="item-form" method="dialog">
        <div class="dialog-head">
          <h3 id="form-title">Submit a website</h3>
          <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
        </div>

        <label class="field">
          <span>Website URL *</span>
          <input name="url" type="url" placeholder="https://example.com" required />
        </label>

        <label class="field">
          <span>Title</span>
          <input name="title" type="text" placeholder="Leave empty to use the domain name" />
        </label>

        <label class="field">
          <span>Description</span>
          <textarea name="description" rows="3" placeholder="What makes it great?"></textarea>
        </label>

        <label class="field">
          <span>Category</span>
          <select name="category" id="category-select"></select>
        </label>

        <div class="field">
          <span>Screenshot</span>
          <div class="dropzone" id="dropzone" tabindex="0">
            <img id="preview" alt="" hidden />
            <p id="dropzone-hint">Drop an image, <u>browse</u>, or paste (Ctrl+V)</p>
            <input type="file" id="image-input" accept="image/*" hidden />
          </div>
          <button type="button" class="link-btn" id="remove-image" hidden>Remove screenshot</button>
        </div>

        <div class="dialog-actions">
          <!-- Only shown when editing an existing item -->
          <button type="button" class="btn btn-danger" id="delete-btn" hidden>Delete</button>
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <!-- Order matters: config and db must load before app -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
